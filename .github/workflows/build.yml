name: Build Shamrock APK

on:
  workflow_dispatch:
  push:
    branches: [v1.0.9]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 生成 debug keystore
      - name: Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l $HOME/.android/debug.keystore

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: gradle-

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: $HOME/.android/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --build-cache --parallel --warning-mode all --stacktrace
          # 列出生成的 APK 供检查
          find app/build/outputs/apk -type f

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shamrock-apks
          path: app/build/outputs/apk/**/release/*.apk
