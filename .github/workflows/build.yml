name: Build Shamrock APK

on:
  workflow_dispatch:
  push:
    branches: [v1.0.9]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'

jobs:
  build:
    name: Build Shamrock
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"  # 替换废弃的 "adopt"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: gradle-

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --build-cache --parallel --warning-mode all --stacktrace
          echo "APK_FILE_ALL=$(find app/build/outputs/apk -name '*release.apk' | grep 'app/release')" >> $GITHUB_ENV
          echo "APK_FILE_ARM64=$(find app/build/outputs/apk -name '*arm64-release.apk')" >> $GITHUB_ENV
          echo "APK_FILE_X86_64=$(find app/build/outputs/apk -name '*x64-release.apk')" >> $GITHUB_ENV
        env:
          # 如果没有secrets，使用debug签名
          ORG_GRADLE_PROJECT_storePassword: "android"
          ORG_GRADLE_PROJECT_keyPassword: "android"
          ORG_GRADLE_PROJECT_keyAlias: "androiddebugkey"
          ORG_GRADLE_PROJECT_storeFile: "../debug.keystore"

      - name: List APK files
        run: find app/build/outputs/apk -type f

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shamrock-apks
          path: app/build/outputs/apk/release/*.apk
